name: Publish unified Krea2 Kaggle notebook
on:
  push:
    branches: [codex/kaggle-krea2-unified]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Inspect execution status and logs (read only)
        shell: bash
        run: |
          for attempt in {1..6}; do
            status="$(kaggle kernels status davis1233798/comfyui-krea2-t4-tpu 2>&1)" || { echo "$status"; exit 1; }
            echo "$status"
            if grep -Eiq 'complete|error|failed|cancel' <<<"$status"; then break; fi
            sleep 20
          done
          kaggle kernels logs davis1233798/comfyui-krea2-t4-tpu || true
          if grep -Eiq 'error|failed|cancel' <<<"$status"; then exit 1; fi
