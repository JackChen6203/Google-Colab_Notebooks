name: Publish unified Krea2 Kaggle notebook
on:
  push:
    branches: [codex/kaggle-krea2-unified]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Publish notebook and request T4 execution
        run: kaggle kernels push --path kaggle/krea2-unified --timeout 300
      - name: Inspect execution status
        run: kaggle kernels status davis1233798/comfyui-krea2-t4-tpu
