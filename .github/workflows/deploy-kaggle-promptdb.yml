name: Verify Krea2 generation on Kaggle T4
on:
  push:
    branches: [codex/krea2-generation-verify]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Inspect test
        shell: bash
        run: |
          for attempt in {1..6}; do
            status="$(kaggle kernels status davis1233798/comfyui-krea2-t4-generation-check 2>&1)" || { echo "$status"; exit 1; }
            echo "$status"
            if grep -Eiq 'complete|error|failed|cancel' <<<"$status"; then break; fi
            sleep 10
          done
          kaggle kernels logs davis1233798/comfyui-krea2-t4-generation-check || true
          if grep -Eiq 'error|failed|cancel' <<<"$status"; then exit 1; fi
      - name: Retrieve verified generated image only
        run: kaggle kernels output davis1233798/comfyui-krea2-t4-generation-check -p /tmp/krea2-image --file-pattern 'Kaggle_Krea2_Neutrino_00001_\\.png$'
      - name: Upload generated image for inspection
        uses: actions/upload-artifact@v4
        with:
          name: krea2-t4-generation-image
          path: /tmp/krea2-image/**/Kaggle_Krea2_Neutrino_00001_.png
          if-no-files-found: error
