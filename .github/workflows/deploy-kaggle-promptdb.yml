name: Inspect PromptDB execution
on:
  push:
    branches: [codex/promptdb-observe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Read notebook execution status
        run: |
          kaggle kernels status davis1233798/comfyui-promptdb-krea2-t4-tpu
          kaggle kernels status davis1233798/comfyui-krea2-tpu-experimental-test || true
      - name: Show redacted diagnostic markers
        shell: bash
        run: |
          kaggle kernels logs davis1233798/comfyui-promptdb-krea2-t4-tpu > /tmp/promptdb-logs.json || exit 0
          python - <<'PY'
          import json
          from pathlib import Path
          try:
              items = json.loads(Path('/tmp/promptdb-logs.json').read_text())
          except Exception:
              print('No parseable execution log available.'); raise SystemExit
          markers = ('Google Drive OAuth authorization verified', 'Google Drive workspace is ready', 'Activated Drive prompt database:', 'PromptDB bootstrap completed', 'ComfyUI is ready', 'Verified the public ComfyUI page', 'Kaggle Secret', 'Could not resolve host', 'RuntimeError:', 'Traceback', 'Error occurred')
          for item in items:
              data = item.get('data', '')
              for line in data.splitlines():
                  for marker in markers:
                      if marker in line:
                          print('marker:', marker)
                          break
          PY
