name: Run Krea2 TPU experiment on Kaggle
on:
  push:
    branches: [codex/kaggle-krea2-tpu-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: davis1233798/comfyui-krea2-tpu-test-20261117
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Submit isolated TPU notebook
        run: kaggle kernels push --path kaggle/krea2-tpu --timeout 43200
      - name: Check initial execution status
        run: kaggle kernels status "$KAGGLE_KERNEL"
