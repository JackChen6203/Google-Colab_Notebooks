name: Run Krea2 TPU experiment on Kaggle
on:
  push:
    branches: [codex/kaggle-krea2-tpu-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: davis1233798/comfyui-krea2-tpu-experimental-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Inspect Kaggle execution
        shell: bash
        run: |
          for attempt in {1..10}; do
            status="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1)" || { echo "$status"; exit 1; }
            echo "$status"
            if grep -Eiq 'complete|error|failed|cancel' <<<"$status"; then break; fi
            sleep 30
          done
          echo 'Recent execution logs:'
          kaggle kernels logs "$KAGGLE_KERNEL" || true
          if grep -Eiq 'error|failed|cancel' <<<"$status"; then exit 1; fi
