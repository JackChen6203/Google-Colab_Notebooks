name: Publish PromptDB Krea2 T4 TPU notebook
on:
  push:
    branches: [codex/kaggle-promptdb-t4-tpu]
    paths:
      - 'kaggle/promptdb-t4-tpu/**'
      - 'promptdb_colab/**'
      - '.github/workflows/deploy-kaggle-promptdb-t4-tpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Publish standalone notebook without starting a session
        run: kaggle kernels push --path kaggle/promptdb-t4-tpu --no-run --timeout 300
      - name: Run separate CPU network diagnostic
        run: kaggle kernels push --path kaggle/network-check --timeout 300
      - name: Read diagnostic status
        shell: bash
        run: |
          for attempt in {1..12}; do
            status="$(kaggle kernels status davis1233798/promptdb-kaggle-network-diagnostic 2>&1)" || { echo "$status"; exit 1; }
            echo "$status"
            if grep -Eiq 'complete|error|failed|cancel' <<<"$status"; then break; fi
            sleep 10
          done
          kaggle kernels logs davis1233798/promptdb-kaggle-network-diagnostic || true
          if ! grep -Eiq 'complete' <<<"$status"; then exit 1; fi
