name: Run PromptDB session acceptance
on:
  push:
    branches: [codex/promptdb-session-acceptance]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      TARGET: davis1233798/comfyui-promptdb-krea2-t4-tpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade kaggle six
      - name: Submit unchanged notebook as a separate Kaggle session
        run: kaggle kernels push --path kaggle/promptdb-t4-tpu --accelerator NvidiaTeslaT4 --timeout 300
      - name: Inspect status and redact runtime logs
        shell: bash
        run: |
          for attempt in {1..12}; do
            status="$(kaggle kernels status "$TARGET" 2>&1)" || { echo "$status"; exit 1; }
            echo "$status"
            if grep -Eiq 'complete|error|failed|cancel' <<<"$status"; then break; fi
            sleep 20
          done
          kaggle kernels logs "$TARGET" > /tmp/promptdb-runtime-log.json || exit 0
          python - <<'PY'
          import json
          from pathlib import Path
          try:
              items = json.loads(Path('/tmp/promptdb-runtime-log.json').read_text())
          except Exception:
              print('No parseable execution logs available.'); raise SystemExit
          markers = ('Google Drive OAuth authorization verified', 'Google Drive workspace is ready', 'Activated Drive prompt database:', 'No Drive prompt JSON found', 'PromptDB bootstrap completed', 'ComfyUI is ready', 'Verified the public ComfyUI page', 'Kaggle Secret', 'Could not resolve host', 'TPU XLA', 'GPU ComfyUI pinned', 'RuntimeError:', 'Traceback', 'PapermillExecutionError')
          for item in items:
              for line in item.get('data', '').splitlines():
                  for marker in markers:
                      if marker in line:
                          print('marker:', marker)
                          break
          PY
